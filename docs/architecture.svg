<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">RAG Chat over PDFs: architecture</title>
  <desc id="d">The Next.js UI sends PDFs and questions to an Express API. On upload the API parses and chunks the PDF, embeds the chunks with the OpenAI API or Ollama, and stores them in Weaviate. On a question it embeds the question, retrieves the three nearest chunks from Weaviate, and sends the question with those chunks to the chat model, then returns the answer.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57534e"/></marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>
  <g font-size="15" fill="#1c1917">
    <rect x="24" y="125" width="150" height="80" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="99" y="160" text-anchor="middle" font-weight="600">Next.js UI</text>
    <text x="99" y="182" text-anchor="middle" font-size="13" fill="#57534e">upload · chat</text>

    <rect x="300" y="105" width="210" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="405" y="140" text-anchor="middle" font-weight="600">Express API</text>
    <text x="405" y="164" text-anchor="middle" font-size="13" fill="#44403c">parse PDF (pdf-parse)</text>
    <text x="405" y="184" text-anchor="middle" font-size="13" fill="#44403c">chunk: 500 words, 50 overlap</text>
    <text x="405" y="204" text-anchor="middle" font-size="13" fill="#44403c">build prompt</text>

    <rect x="650" y="30" width="206" height="96" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="753" y="64" text-anchor="middle" font-weight="600">Model provider</text>
    <text x="753" y="86" text-anchor="middle" font-size="13" fill="#57534e">OpenAI API, or Ollama</text>
    <text x="753" y="106" text-anchor="middle" font-size="13" fill="#57534e">embeddings · chat</text>

    <rect x="650" y="200" width="206" height="96" rx="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <text x="753" y="234" text-anchor="middle" font-weight="600">Weaviate</text>
    <text x="753" y="256" text-anchor="middle" font-size="13" fill="#57534e">class DocumentChunk</text>
    <text x="753" y="276" text-anchor="middle" font-size="13" fill="#57534e">vectors + chunk text</text>
  </g>
  <g stroke="#57534e" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M174,150 L298,150"/>
    <path d="M300,182 L176,182"/>
    <path d="M510,130 L648,85"/>
    <path d="M648,105 L512,148"/>
    <path d="M510,190 L648,235"/>
    <path d="M648,255 L512,208"/>
  </g>
  <g font-size="12" fill="#44403c">
    <text x="237" y="142" text-anchor="middle">PDF · question</text>
    <text x="237" y="200" text-anchor="middle">answer</text>
    <text x="556" y="68" text-anchor="middle">texts to embed,</text>
    <text x="556" y="82" text-anchor="middle">prompt + 3 chunks</text>
    <text x="604" y="150" text-anchor="middle">vectors, answer</text>
    <text x="604" y="200" text-anchor="middle">store vectors</text>
    <text x="578" y="266" text-anchor="middle">top 3 by distance</text>
  </g>
</svg>
